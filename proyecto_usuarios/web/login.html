<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #eef2f1;
            color: #1c2b2a;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        form {
            width: min(380px, 92vw);
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            border: 1px solid #cfdad8;
        }

        h1 {
            margin: 0 0 1.2rem;
            font-size: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 1rem;
            font-size: .95rem;
        }

        input {
            width: 100%;
            margin-top: .3rem;
            padding: .6rem;
            border: 1px solid #9db3b0;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: .7rem;
            border: 0;
            border-radius: 6px;
            background: #0f766e;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }

        #mensaje {
            min-height: 1.4rem;
            margin-top: .8rem;
            color: #b42318;
            font-size: .9rem;
        }
    </style>
</head>

<body>
    <form id="frmLogin">
        <h1>Iniciar sesión</h1>
        <label>Usuario
            <input type="text" id="usuario" maxlength="35" required autofocus>
        </label>
        <label>Clave
            <input type="password" id="clave" maxlength="35" required>
        </label>
        <button type="submit">Entrar</button>
        <div id="mensaje" role="alert"></div>
    </form>
    <script src="/login.js"></script>
</body>

</html>
